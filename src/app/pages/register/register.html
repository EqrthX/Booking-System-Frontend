<div
    class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-teal-900 flex items-center justify-center p-4 relative overflow-hidden">

    <svg class="absolute bottom-0 w-full h-auto text-teal-800/40"
        viewBox="0 0 1440 320" xmlns="http://www.w3.org/2000/svg">
        <path fill="currentColor"
            d="M0,160L48,176C96,192,192,224,288,213.3C384,203,480,149,576,149.3C672,149,768,203,864,224C960,245,1056,235,1152,213.3C1248,192,1344,160,1392,144L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z">
            <animate attributeName="d" dur="12s" repeatCount="indefinite"
                values="M0,224L48,213.3C96,203,192,181,288,181.3C384,181,480,203,576,213.3C672,224,768,224,864,202.7C960,181,1056,139,1152,133.3C1248,128,1344,160,1392,176L1440,192L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z;
                M0,160L48,176C96,192,192,224,288,213.3C384,203,480,149,576,149.3C672,149,768,203,864,224C960,245,1056,235,1152,213.3C1248,192,1344,160,1392,144L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z;
                M0,224L48,213.3C96,203,192,181,288,181.3C384,181,480,203,576,213.3C672,224,768,224,864,202.7C960,181,1056,139,1152,133.3C1248,128,1344,160,1392,176L1440,192L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z" />
        </path>
    </svg>

    <div
        class="absolute top-1/4 right-10 w-48 h-48 bg-blue-500/20 rounded-full blur-3xl animate-pulse"></div>
    <div
        class="absolute bottom-20 left-10 w-32 h-32 bg-teal-400/20 rounded-full blur-2xl animate-pulse"
        style="animation-delay: 2s;"></div>

    <div
        class="relative z-10 max-w-md w-full bg-white/10 backdrop-blur-lg border border-white/20 rounded-3xl shadow-2xl p-8">

        <div class="text-center mb-8">
            <div
                class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-tr from-teal-400 to-blue-500 mb-4 shadow-lg">
                <svg class="w-8 h-8 text-white" fill="none"
                    stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg"><path
                        stroke-linecap="round" stroke-linejoin="round"
                        stroke-width="2"
                        d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
            </div>
            <h2
                class="text-3xl font-bold text-white tracking-wider">สมัครสมาชิก</h2>
            <p
                class="text-cyan-100/80 mt-2 text-sm">สร้างบัญชีเพื่อเริ่มต้นจองคิว</p>
        </div>

        <form class="space-y-5" (ngSubmit)="onSubmit()">
            <div>
                <label
                    class="block text-sm font-medium text-cyan-50 mb-1 ml-1">ชื่อ
                    - นามสกุล</label>
                <input
                    type="text"
                    [(ngModel)]="name"
                    name="name"
                    class="w-full px-5 py-3 bg-slate-900/40 border border-cyan-500/30 rounded-xl text-white placeholder-cyan-100/30 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-transparent transition-all duration-300"
                    placeholder="ชื่อของคุณ">
            </div>

            <div>
                <label
                    class="block text-sm font-medium text-cyan-50 mb-1 ml-1">อีเมล</label>
                <input
                    type="email"
                    [(ngModel)]="email"
                    name="email"
                    class="w-full px-5 py-3 bg-slate-900/40 border border-cyan-500/30 rounded-xl text-white placeholder-cyan-100/30 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-transparent transition-all duration-300"
                    placeholder="your@email.com">
            </div>

            <div>
                <label
                    class="block text-sm font-medium text-cyan-50 mb-1 ml-1">รหัสผ่าน</label>
                <input
                    type="password"
                    [(ngModel)]="password"
                    name="password"
                    class="w-full px-5 py-3 bg-slate-900/40 border border-cyan-500/30 rounded-xl text-white placeholder-cyan-100/30 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-transparent transition-all duration-300"
                    placeholder="••••••••">
            </div>

            <div>
                <label
                    class="block text-sm font-medium text-cyan-50 mb-1 ml-1">ยืนยันรหัสผ่าน</label>
                <input
                    type="password"
                    [(ngModel)]="confirmPassword"
                    name="confirmPassword"
                    class="w-full px-5 py-3 bg-slate-900/40 border border-cyan-500/30 rounded-xl text-white placeholder-cyan-100/30 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-transparent transition-all duration-300"
                    placeholder="••••••••">
            </div>

            <button
                type="submit"
                class="w-full bg-gradient-to-r from-teal-500 to-blue-600 hover:from-teal-400 hover:to-blue-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-teal-500/30 transform hover:-translate-y-0.5 transition-all duration-200 mt-6">
                ยืนยันการสมัครสมาชิก
            </button>
        </form>

        <p class="text-center text-sm text-cyan-100/70 mt-8">
            มีบัญชีอยู่แล้วใช่ไหม?
            <a routerLink="/login"
                class="text-teal-300 hover:text-white font-semibold transition-colors underline decoration-teal-500/50 underline-offset-4">เข้าสู่ระบบ</a>
        </p>
    </div>
</div>
