<div
    class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-teal-900 flex items-center justify-center p-4 relative overflow-hidden">

    <svg class="absolute bottom-0 w-full h-auto text-cyan-800/40"
        viewBox="0 0 1440 320" xmlns="http://www.w3.org/2000/svg">
        <path fill="currentColor"
            d="M0,160L48,176C96,192,192,224,288,213.3C384,203,480,149,576,149.3C672,149,768,203,864,224C960,245,1056,235,1152,213.3C1248,192,1344,160,1392,144L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z">
            <animate attributeName="d" dur="10s" repeatCount="indefinite"
                values="M0,160L48,176C96,192,192,224,288,213.3C384,203,480,149,576,149.3C672,149,768,203,864,224C960,245,1056,235,1152,213.3C1248,192,1344,160,1392,144L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z;
                M0,224L48,213.3C96,203,192,181,288,181.3C384,181,480,203,576,213.3C672,224,768,224,864,202.7C960,181,1056,139,1152,133.3C1248,128,1344,160,1392,176L1440,192L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z;
                M0,160L48,176C96,192,192,224,288,213.3C384,203,480,149,576,149.3C672,149,768,203,864,224C960,245,1056,235,1152,213.3C1248,192,1344,160,1392,144L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z" />
        </path>
    </svg>

    <div
        class="absolute top-20 left-20 w-32 h-32 bg-cyan-500/20 rounded-full blur-2xl animate-pulse"></div>
    <div
        class="absolute bottom-40 right-20 w-40 h-40 bg-teal-400/20 rounded-full blur-2xl animate-pulse"
        style="animation-delay: 1s;"></div>

    <div
        class="relative z-10 max-w-md w-full bg-white/10 backdrop-blur-lg border border-white/20 rounded-3xl shadow-2xl p-8">

        <div class="text-center mb-8">
            <div
                class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-tr from-cyan-400 to-blue-500 mb-4 shadow-lg">
                <svg class="w-8 h-8 text-white" fill="none"
                    stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg"><path
                        stroke-linecap="round" stroke-linejoin="round"
                        stroke-width="2"
                        d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
            </div>
            <h2
                class="text-3xl font-bold text-white tracking-wider">เข้าสู่ระบบ</h2>
            <p
                class="text-cyan-100/80 mt-2 text-sm">ยินดีต้อนรับกลับสู่ระบบจองคิวของเรา</p>
        </div>

        <form class="space-y-5" (ngSubmit)="onSubmit()">
            <div>
                <label
                    class="block text-sm font-medium text-cyan-50 mb-1 ml-1">อีเมล</label>
                <div class="relative">
                    <input
                        type="email"
                        [(ngModel)]="Email"
                        name="email"
                        class="w-full px-5 py-3 bg-slate-900/40 border border-cyan-500/30 rounded-xl text-white placeholder-cyan-100/30 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-transparent transition-all duration-300"
                        placeholder="your@email.com">
                </div>
            </div>

            <div>
                <label
                    class="block text-sm font-medium text-cyan-50 mb-1 ml-1">รหัสผ่าน</label>
                <div class="relative">
                    <input
                        type="password"
                        [(ngModel)]="Password"
                        name="password"
                        class="w-full px-5 py-3 bg-slate-900/40 border border-cyan-500/30 rounded-xl text-white placeholder-cyan-100/30 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-transparent transition-all duration-300"
                        placeholder="••••••••">
                </div>
                <div class="flex justify-end mt-2">
                    <a href="#"
                        class="text-xs text-cyan-300 hover:text-cyan-100 transition-colors">ลืมรหัสผ่าน?</a>
                </div>
            </div>

            <button
                type="submit"
                class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-cyan-500/30 transform hover:-translate-y-0.5 transition-all duration-200 mt-6">
                เข้าสู่ระบบ
            </button>
        </form>

        <p class="text-center text-sm text-cyan-100/70 mt-8">
            ยังไม่มีบัญชีใช่หรือไม่?
            <a routerLink="/register"
                class="text-cyan-300 hover:text-white font-semibold transition-colors underline decoration-cyan-500/50 underline-offset-4">สร้างบัญชีใหม่</a>
        </p>
    </div>
</div>
